name: Limpar deploy travado do Pages

on:
  push:
    paths:
      - '.github/workflows/limpar-deploy-travado.yml'

permissions:
  contents: read
  deployments: write
  pages: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler estado das builds do Pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "::error::E-latest=$(gh api "repos/$REPO/pages/builds/latest" 2>&1 | tr '\n' ' ' | head -c 600)"
          echo "::error::F-historico=$(gh api "repos/$REPO/pages/builds?per_page=3" 2>&1 | tr '\n' ' ' | head -c 600)"
          echo "::error::G-deployments=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=6" --jq '.[] | "\(.id)-\(.sha[0:7])"' 2>&1 | tr '\n' ' ' | head -c 300)"
