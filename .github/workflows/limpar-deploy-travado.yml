name: Limpar deploy travado do Pages

on:
  push:
    paths:
      - '.github/workflows/limpar-deploy-travado.yml'

permissions:
  contents: read
  deployments: write
  pages: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar e remover deployment travado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Deployments antes"
            gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[] | "\(.id) \(.sha[0:7]) \(.created_at)"' || echo "falhou listar"
            echo ""
            echo "## Cancelar pages deployment 382f7cd (build travado)"
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/382f7cd569d30bb6c0aad3c52c536b634a1d44c2/cancel" 2>&1 || echo "cancel falhou"
            echo ""
            echo "## Apagar deployment 7554659855"
            gh api -X DELETE "repos/${{ github.repository }}/deployments/7554659855" 2>&1 || echo "delete falhou"
            echo ""
            echo "## Deployments depois"
            gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[] | "\(.id) \(.sha[0:7]) \(.created_at)"' || echo "falhou listar"
          } >> "$GITHUB_STEP_SUMMARY"
