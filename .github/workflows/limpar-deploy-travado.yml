name: Limpar deploy travado do Pages

on:
  push:
    paths:
      - '.github/workflows/limpar-deploy-travado.yml'

permissions:
  contents: read
  deployments: write
  pages: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar e remover o deployment de Pages travado
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRACADO: 382f7cd569d30bb6c0aad3c52c536b634a1d44c2
        run: |
          set +e
          DIAG=""

          DIAG="$DIAG | 1-status:$(gh api "repos/$REPO/pages/deployments/$TRACADO" 2>&1 | tr '\n' ' ' | head -c 300)"
          DIAG="$DIAG | 2-cancel:$(gh api -X POST "repos/$REPO/pages/deployments/$TRACADO/cancel" 2>&1 | tr '\n' ' ' | head -c 300)"
          DIAG="$DIAG | 3-delete:$(gh api -X DELETE "repos/$REPO/pages/deployments/$TRACADO" 2>&1 | tr '\n' ' ' | head -c 300)"
          DIAG="$DIAG | 4-lista:$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=6" --jq '.[] | "\(.id)-\(.sha[0:7])"' 2>&1 | tr '\n' ' ' | head -c 300)"

          echo "::error::$DIAG"
